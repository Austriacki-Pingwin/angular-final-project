<form [formGroup]="form">
  <div formArrayName="experience" class="experience-list">
    @for (group of experiences.controls; track $index) {
      <div [formGroupName]="$index" class="experience-item">
        <mat-form-field appearance="outline" color="accent">
          <mat-label>Position</mat-label>
          <input matInput formControlName="position" />
        </mat-form-field>

        <mat-form-field appearance="outline" color="accent">
          <mat-label>Company</mat-label>
          <input matInput formControlName="company" />
        </mat-form-field>

        <mat-form-field appearance="outline" color="accent">
          <mat-label>Start date</mat-label>
          <input matInput formControlName="startDate" />
        </mat-form-field>

        <mat-form-field appearance="outline" color="accent">
          <mat-label>End date</mat-label>
          <input matInput formControlName="endDate" />
        </mat-form-field>

        <mat-form-field appearance="outline" color="accent" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput rows="3" formControlName="description"></textarea>
        </mat-form-field>

        <button
          mat-stroked-button
          class="danger-btn"
          color="warn"
          type="button"
          (click)="removeExperience($index)"
        >
          Remove
        </button>
      </div>
    }
  </div>

  <button mat-flat-button color="accent" type="button" (click)="addExperience()">
    Add experience
  </button>
</form>
