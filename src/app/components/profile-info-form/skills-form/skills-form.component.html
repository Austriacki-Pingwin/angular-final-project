<form [formGroup]="form">
  <div formArrayName="skills" class="skills-list">
    @for (control of skills.controls; track $index) {
      <div class="skill-item">
        <mat-form-field appearance="outline" color="accent" class="skill-input">
          <mat-label>Skill</mat-label>
          <input matInput [formControl]="control" />
        </mat-form-field>

        <button
          mat-stroked-button
          class="danger-btn"
          color="warn"
          type="button"
          (click)="removeSkill($index)"
          aria-label="Remove skill"
        >
          Remove
        </button>
      </div>
    }
  </div>

  <button mat-flat-button color="accent" type="button" (click)="addSkill()">Add skill</button>
</form>
