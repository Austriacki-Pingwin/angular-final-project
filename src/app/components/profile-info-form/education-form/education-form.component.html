<form [formGroup]="form">
  <div formArrayName="education" class="education-list">
    @for (group of educations.controls; track $index) {
      <div [formGroupName]="$index" class="education-item">
        <mat-form-field appearance="outline" color="accent">
          <mat-label>Degree</mat-label>
          <input matInput formControlName="degree" />
        </mat-form-field>

        <mat-form-field appearance="outline" color="accent">
          <mat-label>Start date</mat-label>
          <input matInput formControlName="startDate" />
        </mat-form-field>

        <mat-form-field appearance="outline" color="accent">
          <mat-label>End date</mat-label>
          <input matInput formControlName="endDate" />
        </mat-form-field>

        <button
          mat-stroked-button
          color="warn"
          class="danger-btn"
          type="button"
          (click)="removeEducation($index)"
        >
          Remove
        </button>
      </div>
    }
  </div>

  <button mat-flat-button color="accent" type="button" (click)="addEducation()">
    Add education
  </button>
</form>
