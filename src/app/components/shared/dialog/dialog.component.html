<mat-dialog-content>
  <ng-container *ngComponentOutlet="data.component; inputs: data.inputs" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button [matButton]="data.buttonText ? 'filled' : ''" (click)="close()">
    {{ data.buttonText ?? ('CREATOR.CLOSE' | translate) }}
  </button>
</mat-dialog-actions>
