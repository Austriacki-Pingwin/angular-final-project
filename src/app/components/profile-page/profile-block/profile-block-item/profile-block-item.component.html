@if (skillTitle()) {
  <div class="skill-item">
    {{ skillTitle() }}
  </div>
} @else {
  @for (entry of itemData() | keyvalue; track entry.key) {
    @if (
      entry.key !== 'id' && entry.value !== null && entry.value !== undefined && entry.value !== ''
    ) {
      <div>
        <strong>{{ entry.key }}</strong
        >: {{ entry.value }}
      </div>
    }
  }
}
