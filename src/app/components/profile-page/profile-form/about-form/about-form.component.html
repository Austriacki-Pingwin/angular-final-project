<form [formGroup]="form" (ngSubmit)="save()" class="form">
  <mat-form-field appearance="outline" color="accent">
    <mat-label>About</mat-label>
    <textarea matInput rows="10" formControlName="content"></textarea>
    @if (form.controls.content.invalid && form.controls.content.touched) {
      <mat-error> About content is required and should be at least 10 characters </mat-error>
    }
  </mat-form-field>

  <button mat-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
</form>
