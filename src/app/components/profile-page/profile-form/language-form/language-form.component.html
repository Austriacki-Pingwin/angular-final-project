<form [formGroup]="form" (ngSubmit)="save()" class="form">
  <mat-form-field appearance="outline">
    <mat-label>Language</mat-label>
    <input matInput formControlName="name" placeholder="Your Language" />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <mat-error> Language is required </mat-error>
    }
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Proficiency</mat-label>
    <mat-select formControlName="proficiency">
      <mat-option value="Beginner">Beginner</mat-option>
      <mat-option value="Intermediate">Intermediate</mat-option>
      <mat-option value="Advanced">Advanced</mat-option>
      <mat-option value="Native">Native</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-button color="primary" type="submit" [disabled]="form.invalid">Save</button>
</form>
