<app-tabs [activeTab]="activeTab" (tabChange)="activeTab = $event" />

<div class="form-wrapper">
  @switch (activeTab) {
    @case ('personal') {
      <app-personal-form />
    }
    @case ('links') {
      <app-link-form />
    }
    @case ('about') {
      <app-about-form />
    }
    @case ('skills') {
      <app-skills-form />
    }

    @case ('languages') {
      <app-language-form />
    }
    @case ('experience') {
      <app-experience-form />
    }
    @case ('education') {
      <app-education-form />
    }
  }
</div>
