<div class="d-flex justify-content-center">
  <div class="text-center mt-5 pt-5">
    <h1>Welcome to our App.</h1>
    <p>Please sign-in or sign-up to start using our App.</p>
    <form [formGroup]="form" (submit)="onSubmit()">
      <mat-form-field appearance="outline" class="d-block">
        <mat-label>Email/Username</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="d-block">
        <mat-label>Password</mat-label>
        <input type="password" matInput formControlName="password" />
      </mat-form-field>

      <!-- * Error message -->
      @if (errorMessage()) {
        <div class="alert alert-danger d-flex align-items-center p-2">
          <mat-icon fontIcon="info" />
          {{ errorMessage() }}
        </div>
      }

      <!-- *Progress spinner -->
      @if (isSubmissionInProgress()) {
        <div class="d-flex align-items-center">
          <mat-spinner [diameter]="22" />
          Signing-in...
        </div>
      }
      <button type="submit" matButton="tonal" class="d-block mb-1 auth-button">Sign-In</button>
    </form>

    <button matButton="tonal" class="d-block mb-2 auth-button">Sign-In with Google</button>
    <p>You don't have an account</p>
    <button matButton="filled" [routerLink]="['/auth/sign-up']" class="d-block auth-button">
      Sign-Up
    </button>
    <a [routerLink]="['/auth/forgot-password']" class="d-block pt-2">Forgot Password</a>
  </div>
</div>
