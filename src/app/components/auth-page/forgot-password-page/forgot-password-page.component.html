<div class="d-flex justify-content-center">
  <div class="text-center mt-5 pt-5">
    <h1>Welcome to our App.</h1>
    <p>Please enter you Email/Username to reset the password.</p>
    <mat-form-field appearance="outline" class="d-block">
      <mat-label>Email/Username</mat-label>
      <input matInput />
    </mat-form-field>
    <button matButton="tonal" class="d-block mb-1 auth-button">Reset Password</button>
    <p>Sign-in instead?</p>
    <button matButton="filled" [routerLink]="['/auth/sign-in']" class="d-block auth-button">
      Sign-In
    </button>
  </div>
</div>
