<div class="add-cv" (click)="openDialog()">
  <div class="add-cv__icon_wrapper">
    <mat-icon [fontIcon]="addCvConfig.icon" />
  </div>
  <div class="add-cv__text">
    <h3 class="title">
      {{ addCvConfig.title }}
    </h3>
    <p class="description">
      {{ addCvConfig.description }}
    </p>
  </div>
</div>
