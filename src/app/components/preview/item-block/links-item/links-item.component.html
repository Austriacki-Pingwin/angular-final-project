@let links = data();

@if (links && links.length > 0) {
  <h2>Links</h2>
  <div
    cdkDropList
    [cdkDropListData]="links"
    cdkDropListLockAxis="x"
    (cdkDropListDropped)="linksDrop($event)"
  >
    @for (link of links; track link?.id) {
      <a href="{{ link?.url }}" target="_blank" cdkDrag>{{ link?.label }}</a>
    }
  </div>
}
