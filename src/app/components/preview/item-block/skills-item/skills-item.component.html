@let skills = data();

@if (skills && skills.length > 0) {
  <h2>Skills</h2>
  <div
    cdkDropList
    [cdkDropListData]="skills"
    cdkDropListLockAxis="x"
    (cdkDropListDropped)="skillDrop($event)"
  >
    @for (skill of skills; track skill?.id) {
      <p class="skill" cdkDrag>{{ skill?.title }}</p>
    }
  </div>
}
