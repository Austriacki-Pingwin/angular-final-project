@let personal = data();

@if (personal.length) {
  <div class="personal">
    <h2 class="first-name"></h2>
    <h2 class="last-name"></h2>
  </div>
  <div>
    <p>Front-End Developer</p>
  </div>
  <div class="contact">
    <span class="email"></span>
    <span class="phone"></span>
    <span class="location"></span>
  </div>
} @else {
  <p>This block is not available yet</p>
}
