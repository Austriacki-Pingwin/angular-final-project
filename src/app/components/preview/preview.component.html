@let blocks = cvBlocks();
<div class="title">
  <h2>{{ 'CREATOR.PREVIEW' | translate }}: {{ title }}</h2>
  <button matIconButton (click)="printCv()"><mat-icon>print</mat-icon></button>
</div>
<div class="wrapper" cdkDropList (cdkDropListDropped)="drop($event)">
  @if (blocks.length) {
    <div class="print-container">
      @for (block of blocks; track block.type) {
        <app-item-block [cvBlock]="block" />
      }
    </div>
  } @else {
    <p>Oops</p>
  }
</div>
